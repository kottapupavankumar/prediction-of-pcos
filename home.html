{% extends 'base.html' %}
{% block content %}
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>PCOS Data Form</title>
    <style>
        body {font-family: Arial, sans-serif;}
        form {width: 50%;margin: 40px auto;padding: 20px;border: 1px solid #ccc;border-radius: 10px;box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);}
        label {display: block;margin-bottom: 10px;}
        input[type="text"], input[type="number"], select {width: 100%;height: 40px;margin-bottom: 20px;padding: 10px;border: 1px solid #ccc;}
        input[type="submit"] {width: 100%;height: 40px;background-color: #4CAF50;color: #fff;padding: 10px;border: none;border-radius: 10px;cursor: pointer;}
        input[type="submit"]:hover {background-color: #3e8e41;}
    </style>
</head>
<body>
    <form action="add" >
        {% csrf_token %}
        <h2>PCOS Data Form</h2>
        <h3>Section 1 : Personal Data</h3>
        <label for="age">Age:</label>
        <input type="number" step="any" id="age" name="age" required>
        <label for="weight">Weight (in kg):</label>
        <input type="number" step="any" id="weight" name="weight" required>
        <label for="height">Height (in cm):</label>
        <input type="number" step="any" id="height" name="height" required>
        <label for="hip">Hip(inch):</label>
        <input type="number" step="any" id="hip" name="hip" required> 
        <label for="waist">Waist(inch):</label>
        <input type="number" step="any" id="waist" name="waist" required> 
        <label for="waisthip">Waist:Hip Ratio:</label>
        <input type="number" step="any" id="waisthip" name="waisthip" required> 
        <label for="bmi">BMI:</label>
        <input type="number" step="any" id="bmi" name="bmi" required>
        <label for="pulserate">Pulse Rate(bpm) :</label>
        <input type="number" step="any" id="pulserate" name="pulserate" required>
        <label for="cycle">Cycle(R/I):</label>
        <input type="number" step="any" id="cycle" name="cycle" required>
        <label for="cyclelength">Cycle length(days):</label>
        <input type="number" step="any" id="cyclelength" name="cyclelength" required>
        <label for="rr">RR (breaths/min):</label>
        <input type="number" step="any" id="rr" name="rr" required>
        <label for="hb">Hb(g/dl):</label>
        <input type="number" step="any" id="hb" name="hb" required>
        <label for="bloodgroup">Blood Group (Select):</label>
        <select id="bloodgroup" name="bloodgroup" required>
            <option value="">Select</option>
            <option value="11">A+</option>
            <option value="12">A-</option>
            <option value="13">B+</option>
            <option value="14">B-</option>
            <option value="15">O+</option>
            <option value="16">O-</option>
            <option value="17">AB+</option>
            <option value="18">AB-</option>
        </select>
        <label for="regularexercise">Regular Exercise (Yes/No):</label>
        <select id="regularexercise" name="regularexercise" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="pregnancy">Pregnancy (Yes/No):</label>
        <select id="pregnancy" name="pregnancy" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="noofabortions">No Of Abortions :</label>
        <input type="number" step="any" id="noofabortions" name="noofabortions" required> 
        <h3>Section 2 : Symptoms </h3>
        <label for="weightgain">Weight Gain (Yes/No):</label>
        <select id="weightgain" name="weightgain" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="hairgrowth">Hair Growth (Yes/No):</label>
        <select id="hairgrowth" name="hairgrowth" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="skindarkening">Skin Darkening (Yes/No):</label>
        <select id="skindarkening" name="skindarkening" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="hairloss">Hair Loss (Yes/No):</label>
        <select id="hairloss" name="hairloss" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="pimples">Pimples (Yes/No):</label>
        <select id="pimples" name="pimples" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="diabetes">Diabetes (Yes/No):</label>
        <select id="diabetes" name="diabetes" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="hyperextension">Hyperextension (Yes/No):</label>
        <select id="hyperextension" name="hyperextension" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="infertility">Infertility (Yes/No):</label>
        <select id="infertility" name="infertility" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option></select>
        <label for="stresslevels">Stress Level (1 to 5):</label>
        <input type="number" step="any" id="stresslevels" name="stresslevels" required> 
        <h3>Section 3 : Harmones Levels </h3>
        <label for="betahcg1">I beta-HCG(mIU/mL):</label>
        <input type="number" step="any" id="betahcg1" name="betahcg1" required> 
        <label for="betahcg2">II beta-HCG(mIU/mL):</label>
        <input type="number" step="any" id="betahcg2" name="betahcg2" required> 
        <label for="tsh">TSH (mIU/L):</label>
        <input type="number" step="any" id="tsh" name="tsh" required>
        <label for="amh">AMH(ng/mL):</label>
        <input type="number" step="any" id="amh" name="amh" required> 
        <label for="prl">PRL(ng/mL):</label>
        <input type="number" step="any" id="prl" name="prl" required> 
        <label for="vit">Vit D3 (ng/mL):</label>
        <input type="number" step="any" id="vit" name="vit" required> 
        <label for="prg">PRG(ng/mL):</label>
        <input type="number" step="any" id="prg" name="prg" required> 
        <label for="rbs">RBS(mg/dl):</label>
        <input type="number" step="any" id="rbs" name="rbs" required> 
        <label for="bpsystolic">BP_Systolic (mmHg):</label>
        <input type="number" step="any" id="bpsystolic" name="bpsystolic" required> 
        <label for="bpdiastolic">BP_Diastolic (mmHg):</label>
        <input type="number" step="any" id="bpdiastolic" name="bpdiastolic" required> 
        <label for="folliclel">Follicle No. (L):</label>
        <input type="number" step="any" id="folliclel" name="folliclel" required> 
        <label for="follicler">Follicle No. (R):</label>
        <input type="number" step="any" id="follicler" name="follicler" required> 
        <label for="avgfsizel">Avg.F size (L)(mm):</label>
        <input type="number" step="any" id="avgfsizel" name="avgfsizel" required> 
        <label for="avgfsizer">Avg.F size (R)(mm):</label>
        <input type="number" step="any" id="avgfsizer" name="avgfsizer" required> 
        <label for="endometrium">Endometrium (mm):</label>
        <input type="number" step="any" id="endometrium" name="endometrium" required> 
        <input type="submit">
    </form>
</body>
</html>
{% endblock %}
